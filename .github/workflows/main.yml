name: Build Kurt Dhylan Moto Shop Inventory APK

on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Verify Project
        run: |
          echo "Repository:"
          pwd
          echo "Project:"
          test -f ./KurtDhylanMotoShopInventory.csproj
          ls -la ./KurtDhylanMotoShopInventory.csproj

      - name: Restore
        run: dotnet restore ./KurtDhylanMotoShopInventory.csproj

      - name: Publish APK
        run: |
          dotnet publish ./KurtDhylanMotoShopInventory.csproj \
            -f net8.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            --no-restore

      - name: Find APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurt-Dhylan-Moto-Shop-Inventory-APK
          path: "**/bin/Release/net8.0-android/**/*.apk"
          if-no-files-found: error
