name: Build Kurt Dhylan Moto Shop Inventory APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore ./KurtDhylanMotoShopInventory.csproj

      - name: Build APK
        run: |
          dotnet publish ./KurtDhylanMotoShopInventory.csproj \
            -f net8.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurt-Dhylan-Moto-Shop-Inventory
          path: "**/*.apk"
          if-no-files-found: error
